<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta charset="utf-8">
  <!-- The CSP comes first so it covers everything after it. Nothing loads
       from another origin; no inline script or style anywhere. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Countries</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/map.css">
  <link rel="stylesheet" href="./css/practice.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <!-- One section per view; js/app.js shows one at a time. -->
    <section id="view-home" class="view view-home" tabindex="-1">
      <p class="status">Loading…</p>
    </section>
    <section id="view-practice" class="view view-practice" tabindex="-1" hidden></section>
    <section id="view-test" class="view view-test" tabindex="-1" hidden></section>
    <noscript><p class="status">Countries needs JavaScript.</p></noscript>
  </main>
</body>
</html>
