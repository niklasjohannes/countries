name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref, but only for pull requests. A push to
# main is never cancelled, so a fast second merge cannot skip the privacy check
# of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned to the current Active LTS major.
          node-version: 24

      # Zero npm dependencies, so there is no install step.
      # `node --test` with no arguments discovers `**/*.test.{js,mjs,cjs}` (and the
      # other default patterns) across the repo, and exits 0 when it finds none.
      - name: Run tests
        run: node --test

  # Layer 4 of the privacy guard (docs/SPEC.md). Needs the full history to see
  # the whole base..head range. The job name `privacy` is the status check to
  # require in branch protection.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Event values go through env, never straight into the script.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-privacy.js --range "$BASE_SHA..$HEAD_SHA"

      # Catches a squash merge that GitHub authored with a non-noreply email.
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/check-privacy.js --range "$BEFORE_SHA..$AFTER_SHA"

      - name: Scan whole tree
        run: node scripts/check-privacy.js --tree
